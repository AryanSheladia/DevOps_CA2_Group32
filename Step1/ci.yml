name: Lex Orion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Streamlit app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Verify dependency metadata
        run: python -m pip check

  package:
    name: Package deployable source
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create application bundle
        run: |
          mkdir -p dist/lex-orion
          rsync -a --exclude='.git' --exclude='dist' --exclude='__pycache__' ./ dist/lex-orion/
          tar -czf dist/lex-orion.tar.gz -C dist lex-orion

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: lex-orion-${{ github.sha }}
          path: dist/lex-orion.tar.gz
          if-no-files-found: error
# Optional complete local rehearsal; default compose.yaml monitors Render.
services:
  app:
    build:
      context: ..
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN from monitoring/secrets/metrics_token.txt}
      ENABLE_TRAINING: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  prometheus:
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy
